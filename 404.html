        .error-label {

            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #929292;
        }

        .error-number {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            font-size: clamp(100px, 22vw, 210px);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -12px;
            color: #fff;
        }

        .error-title {
            margin: 35px 0 15px;
            font-family: 'Manrope', sans-serif;
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 600;
            letter-spacing: -1px;
        }

        .error-description {
            max-width: 470px;
            margin: 0 auto;
            color: #999;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 38px;
        }

        .error-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 26px;
            border: 1px solid #fff;
            background: #fff;
            color: #080808;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .error-button:hover {
            background: transparent;
            color: #fff;
        }

        .error-button-secondary {
            background: transparent;
            color: #fff;
            border-color: #444;
        }

        .error-button-secondary:hover {
            background: #fff;
            color: #080808;
        }

        .error-footer {
            margin-top: 90px;
            padding-top: 22px;
            border-top: 1px solid #242424;
            color: #686868;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .error-footer a {
            color: #aaa;
            text-decoration: none;
        }

        .error-footer a:hover {
            color: #fff;
        }

        @media (max-width: 480px) {
            .error-number {
                letter-spacing: -6px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-button {
                width: 100%;
                max-width: 280px;
            }

            .error-footer {
                margin-top: 65px;
                line-height: 2;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {

                transition-duration: 0.01ms !important;
